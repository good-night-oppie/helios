name: Engine CI

on:
  push:
    branches: [ master, feat/**, fix/** ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: "engine-ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # Check out repository code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Go environment based on go.mod
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Install required system libraries for RocksDB
      - name: Install RocksDB deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            librocksdb-dev libsnappy-dev zlib1g-dev libbz2-dev liblz4-dev libzstd-dev

      # Run static analysis
      - name: go vet
        run: go vet ./...

      # Run Go unit tests with CGO enabled
      - name: go test
        run: |
          export CGO_ENABLED=1
          go test -v ./...

      # Build the CLI binary
      - name: Build CLI
        shell: bash
        run: |
          set -euo pipefail
          # Locate the first "main" package inside /cmd/*
          MAIN="$(go list -f '{{if eq .Name "main"}}{{.Dir}}{{end}}' ./... | grep -E '/cmd/[^/]+$' | head -n1)"
          mkdir -p dist
          # Build the binary into the repo-root dist/helios. Pass $MAIN as the build
          # target (not `-C "$MAIN" ... .`): with `-C`, the `-o dist/helios` output path
          # is resolved relative to $MAIN, so the artifact landed in $MAIN/dist/helios
          # and the repo-root sha256sum below only ever "found" the committed binary.
          # Once that tracked binary is untracked this step must build to the real path.
          CGO_ENABLED=1 go build -o dist/helios "$MAIN"
          # Generate SHA256 checksum
          sha256sum dist/helios | tee dist/helios.sha256
          # Leave a trailing newline here to safely end the block

      # Upload built artifact so it can be downloaded later
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helios-linux-amd64
          path: dist/*